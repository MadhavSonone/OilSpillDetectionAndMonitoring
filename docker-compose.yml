version: "3.8"

services:
  # Database: Postgres with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: aegis-db
    environment:
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=aegis_pass
      - POSTGRES_DB=aegis_ocean
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-network

  # Kafka: Message Broker
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: aegis-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - aegis-network

  kafka:
    image: bitnami/kafka:latest
    container_name: aegis-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper
    networks:
      - aegis-network

  # Spark: Processing Engine
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: aegis-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - aegis-network

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: aegis-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge

volumes:
  postgres_data:
